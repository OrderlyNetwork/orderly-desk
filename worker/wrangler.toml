name = "orderly-desk-agents"
main = "src/index.ts"
compatibility_date = "2026-11-10"

[observability]
enabled = true

[vars]
ORDERLY_NETWORK = "testnet"
ORDERLY_API_BASE = "https://testnet-api.orderly.org"
SITE_ORIGIN = "http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,https://orderly-desk.pages.dev"
AGENTS_ENABLED = "1"

[[d1_databases]]
binding = "DB"
database_name = "orderly-desk-agents"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
crons = ["*/2 * * * *"]

# Production enables Workers AI for the one-sentence commentary. Local dev does
# not need a remote AI session; the agents fall back to the rule text.
[env.production]
name = "orderly-desk-agents"

[env.production.observability]
enabled = true

[env.production.vars]
ORDERLY_NETWORK = "testnet"
ORDERLY_API_BASE = "https://testnet-api.orderly.org"
SITE_ORIGIN = "http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,https://orderly-desk.pages.dev"
AGENTS_ENABLED = "1"

[[env.production.d1_databases]]
binding = "DB"
database_name = "orderly-desk-agents"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[env.production.triggers]
crons = ["*/2 * * * *"]

[env.production.ai]
binding = "AI"
